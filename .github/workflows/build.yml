name: Build pk3s

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile packs
        run: python build.py --all
      - name: Upload pk3s
        uses: actions/upload-artifact@v4
        with:
          name: pk3s
          path: dist/*.pk3
      - name: Attach to release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pk3
